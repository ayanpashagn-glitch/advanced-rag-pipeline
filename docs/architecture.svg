<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">ASTRA INTEL architecture</title><desc id="desc">Browser calls FastAPI. Uploads become page-aware chunks, embeddings and SQLite records. Queries retrieve evidence with FAISS, generate claims, validate quotations and entailment, and return cited answers.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#beef8a" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="820" fill="#0a1014"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="62" fill="#beef8a" font-size="15" letter-spacing="3">ASTRA INTEL / SYSTEM ARCHITECTURE</text><text x="60" y="103" fill="#edf2f3" font-size="28">From uploaded documents to traceable answers</text>
<g fill="#111e24" stroke="#415747" stroke-width="1.5">
<rect x="60" y="150" width="260" height="85" rx="10"/><rect x="465" y="150" width="270" height="85" rx="10"/><rect x="870" y="150" width="270" height="85" rx="10"/>
<rect x="60" y="325" width="260" height="95" rx="10"/><rect x="465" y="325" width="270" height="95" rx="10"/><rect x="870" y="325" width="270" height="95" rx="10"/>
<rect x="60" y="530" width="260" height="95" rx="10"/><rect x="465" y="530" width="270" height="95" rx="10"/><rect x="870" y="530" width="270" height="95" rx="10"/>
</g>
<g fill="#edf2f3" text-anchor="middle" font-size="19"><text x="190" y="183">Browser interface</text><text x="600" y="183">FastAPI</text><text x="1005" y="183">PDF / TXT / MD</text><text x="190" y="360">SQLite storage</text><text x="600" y="360">Ollama embeddings</text><text x="1005" y="360">Page-aware chunks</text><text x="190" y="567">FAISS retrieval</text><text x="600" y="567">Ollama / Groq</text><text x="1005" y="567">Evidence validation</text></g>
<g fill="#9bafb7" text-anchor="middle" font-size="13"><text x="190" y="208">Upload · Ask · Compare · Cite</text><text x="600" y="208">Validate · Scope · Orchestrate</text><text x="1005" y="208">Extract text / optional Tesseract OCR</text><text x="190" y="388">Pages · Vectors · Chats · Cache</text><text x="600" y="388">Text → numeric meaning vectors</text><text x="1005" y="388">1000 characters / 200 overlap</text><text x="190" y="595">Selected sources only</text><text x="600" y="595">Structured claims and quotations</text><text x="1005" y="595">Exact quote + entailment check</text></g>
<g stroke="#beef8a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"><path d="M320 191 H463"/><path d="M735 191 H868"/><path d="M1005 235 V323"/><path d="M870 373 H737"/><path d="M465 373 H322"/><path d="M190 420 V528"/><path d="M320 578 H463"/><path d="M735 578 H868"/><path d="M1005 625 V700 H30 V192 H58"/></g>
<g font-size="12" fill="#beef8a"><text x="343" y="180">HTTP requests</text><text x="787" y="180">upload</text><text x="205" y="477">question vector</text><text x="359" y="566">evidence</text><text x="772" y="566">claims</text><text x="440" y="688">Validated answer + page citations returned through FastAPI</text></g>
<text x="60" y="755" fill="#91a5ae" font-size="13">Summary: all chunks → batch summaries → evidence reduction → verified concise summary.</text><text x="60" y="782" fill="#91a5ae" font-size="13">No web fallback. Local single-user application. Verification reduces errors; users should inspect source evidence.</text>
</g></svg>
